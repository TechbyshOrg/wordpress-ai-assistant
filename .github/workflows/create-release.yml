name: Create Release Zip

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare plugin folder
        run: |
          mkdir wacdmg-ai-content-assistant
          rsync -a ./ wacdmg-ai-content-assistant/ \
            --exclude-from=.distignore \
            --exclude='wacdmg-ai-content-assistant' \
            --exclude='wacdmg-ai-content-assistant_*.zip'

      - name: Create zip file
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          ZIP_NAME="wacdmg-ai-content-assistant_${TAG_NAME}.zip"
          zip -r "$ZIP_NAME" wacdmg-ai-content-assistant
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
